# =============================================
# ARION AI — Cloud Build CI/CD Pipeline
# Triggered on push to main branch.
# Builds Docker image → pushes to Artifact Registry → deploys to Cloud Run
# =============================================

substitutions:
  _REGION: asia-south1
  _SERVICE: arion-ai-backend
  _PROJECT: aegis-crisis-response-493911
  _REPO: arion-ai
  _IMAGE: backend
  _TAG: manual  # Overridden by triggers with $COMMIT_SHA

steps:
  # ── Step 1: Build the Docker image ──────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: '.'

  # ── Step 2: Push image to Artifact Registry ──────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}'
    waitFor: ['build-image']

  # ── Step 3: Deploy to Cloud Run ──────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloudrun'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:${_TAG}'
      - '--region=${_REGION}'
      - '--project=${_PROJECT}'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60'
      - '--quiet'
    waitFor: ['push-image']

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: '1200s'
